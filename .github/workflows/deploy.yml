# Deploy para o Firebase Hosting, só manual (Actions → Deploy Firebase Hosting → Run workflow).
# Estava ligado a push em master e a pull requests, mas sem o segredo abaixo falhava
# sempre com cruz vermelha. O site publica-se à mão com `firebase deploy --only hosting`.
#
# Para voltar ao deploy automático: criar o secret FIREBASE_SERVICE_ACCOUNT no repositório
# (`firebase init hosting:github` ou consola Google Cloud) e acrescentar em `on:`
#   push: { branches: [master] }
name: Deploy Firebase Hosting

on:
  workflow_dispatch:

jobs:
  deploy-live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: portfolio-tiago-silva

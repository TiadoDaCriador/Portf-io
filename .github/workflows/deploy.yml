# Deploy para o Firebase Hosting:
# - push em master  → site "live"
# - pull request    → canal de pré-visualização temporário (URL no comentário do PR)
#
# Requer o secret FIREBASE_SERVICE_ACCOUNT no repositório GitHub — ver README
# (gerado com `firebase init hosting:github` ou na consola Google Cloud).
name: Deploy Firebase Hosting

on:
  push:
    branches: [master]
  pull_request:

jobs:
  deploy-live:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: portfolio-tiago-silva

  deploy-preview:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: portfolio-tiago-silva

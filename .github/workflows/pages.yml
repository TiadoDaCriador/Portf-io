# Deploy alternativo ao Firebase Hosting (ver deploy.yml): publica html-css-js/ no
# GitHub Pages. Só manual: o site vive no Firebase e, sem o Pages ativo, isto falhava
# com cruz vermelha a cada push.
#
# Para usar: Settings → Pages → Build and deployment → Source: "GitHub Actions" e depois
# Actions → Deploy GitHub Pages → Run workflow. Para o voltar a ligar aos pushes,
# acrescentar em `on:`  push: { branches: [master] }
name: Deploy GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: html-css-js
      - id: deployment
        uses: actions/deploy-pages@v4
